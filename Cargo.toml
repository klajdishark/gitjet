[package]
name = "gitjet"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "A keyboard-driven terminal Git client with IDE-grade features: changelists, shelf, partial commits, 3-way merge, interactive rebase, blame, local history and more"
license = "MIT"
readme = "README.md"
repository = "https://github.com/klajdishark/gitjet"
homepage = "https://github.com/klajdishark/gitjet"
keywords = ["git", "tui", "terminal", "vcs", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ratatui = "0.29"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2", features = ["unicode"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }
# The local intent model (FunctionGemma through llama.cpp), compiled into the binary.
llama-cpp-2 = { version = "0.1.160", default-features = false, optional = true }

[features]
# Build with the AI model inside: GITJET_MODEL=/path/to/model.gguf cargo build --features ai
ai = ["dep:llama-cpp-2"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
